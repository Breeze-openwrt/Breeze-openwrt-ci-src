# 🧪【独立环境验证】ubuntu-VER
#
#    【为什么单独成文件而不是用 matrix】：
#      matrix 展开的两个 job 在实测中长时间停在「等待 runner 分配」状态（已生成 job ID
#      但没有任何步骤记录），无法区分究竟是排队拥塞、还是某个标签的 runner 池容量不足。
#      拆成两个独立 workflow 后：① 两者可各自独立触发 / 独立重跑 / 互不牵连；
#      ② 哪一边起不来一目了然，能立刻判断是「平台排队」还是「该版本标签不可用」。
#
#    【验证目标】：确认在 ubuntu-VER 上能否稳定编译出 Yashe 固件。
#      这是为把主工作流从已弃用的 ubuntu-22.04 迁出去做实测背书。
#
#    【已知差异】apt 依赖已同时适配 noble(24.04) 与 resolute(26.04)：
#      删 python2.7 / libncurses5-dev / libncursesw5-dev / libpcre3-dev / p7zip-full /
#         libz-dev / p7zip，
#      改 gnutls-dev→libgnutls28-dev、mkisofs→genisoimage、p7zip→7zip。
# -----------------------------------------------------------------------------
#
# Copyright (c) 2019-2020 P3TERX <https://p3terx.com>
#
# This is free software, licensed under the MIT License.
# See /LICENSE for more information.
#
# https://github.com/P3TERX/Actions-OpenWrt
# Description: Build OpenWrt using GitHub Actions
#
# -----------------------------------------------------------------------------
# 🧪【主力环境验证】ubuntu-26.04
#
#    【目的】：一次性并行验证「换一个 GitHub Actions runner 基础环境」到底能不能编出固件，
#    主工作流已统一到 ubuntu-26.04（24.04 保留为主工作流 runner_os 下拉框里的备用选项，
#    不再单独维护验证文件——需要时用主工作流 runner_os=ubuntu-24.04 跑一遍即可，
#    它的能力是本验证文件的超集：Yashe + Taiyi 双固件 + 发布 release）。
#
#    【为什么不用 ubuntu-22.04】：
#      1. Ubuntu 22.04 runner 镜像已于 2026-09-17 进入弃用期，2027-04-17 将彻底停止支持。
#      2. ubuntu-latest 标签正在向 Ubuntu 26.04 迁移（2026-10-19 ~ 2026-11-19 窗口期）。
#      3. ubuntu-22.04 自带 clang 14，不认识 gn 硬编码的 `-std=c++23`（需 clang >= 17）。
#      4. ubuntu-26.04 镜像预装的 clang 21 原生支持 C++23（24.04 的 clang 18 同样支持）。
#
#    【设计要点】：
#      • 独立成文件（而非 matrix 展开）—— 两者可各自独立触发 / 独立重跑 / 互不牵连，
#        哪一边起不来一目了然，能立刻区分「平台排队」与「该版本标签不可用」。
#      • 缓存 key 带上 Ubuntu 版本 —— 24.04 与 26.04 的 toolchain/ccache 必须物理隔离，
#        否则两个 job 会争抢同一个 cache key（后写入的会触发 "Unable to reserve cache" 警告）。
#      • apt 依赖已同时适配 noble(24.04) 与 resolute(26.04) 两个源：
#        删 python2.7 / libncurses5-dev / libncursesw5-dev / libpcre3-dev / p7zip-full，
#        改 gnutls-dev→libgnutls28-dev、mkisofs→genisoimage、p7zip→7zip。
#      • 保留 gn 的 C++23→C++2b 兜底补丁（同一份 C++23 标准草案，语义等价）。
# -----------------------------------------------------------------------------

name: 🧪 Verify ubuntu-26.04 # 🏷️ 单环境兼容性验证

on:
  workflow_dispatch: # 🖱️ 手动触发
    inputs:
      build_yashe:
        description: "🔥 是否编译 Yashe 固件？"
        required: true
        type: boolean
        default: true
      build_taiyi:
        description: "🔥 是否编译 Taiyi 固件？（验证环境兼容性通常只需勾一个）"
        required: true
        type: boolean
        default: false

env: # 🌍 全局环境变量
  REPO_URL: https://github.com/VIKINGYFY/immortalwrt.git
  REPO_BRANCH: main
  FEEDS_CONF: feeds.conf.default
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: false # 🛡️ 验证矩阵不发布 Release，只上传 artifact
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    # 🛡️ 同一个 cache key 同时被两个 job 写入会触发 "Unable to reserve cache"，
    #    用 concurrency 串行化同名缓存的写入。
    concurrency:
      group: verify-ubuntu-26.04-{{ github.repository }}
      cancel-in-progress: false

    runs-on: ubuntu-26.04

    env:
      WORK_DIR: /workdir
      FILE_DATE: _fallback_date
      FIRMWARE: /workdir/firmware

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🕵️‍♂️ Environment Report (环境自检快照)
        run: |
          echo "================================================="
          echo "🧪 验证矩阵环境自检报告"
          echo "================================================="
          echo "🏷️ 目标 runner : ubuntu-26.04"
          echo "🖥️ 实际系统   : $(lsb_release -ds 2>/dev/null || cat /etc/os-release | head -1)"
          echo "🧿 内核版本   : $(uname -r)"
          echo "🧮 CPU 核心数 : $(nproc)"
          echo "🧠 内存       : $(free -h | awk '/^Mem:/{print $2}')"
          echo "💽 磁盘       : $(df -h / | awk 'NR==2{print $4" 可用 ("$5")"}')"
          echo "🦯 LLVM 默认  : $(ls /usr/lib/llvm-* -d 2>/dev/null | tr '\n' ' ')"
          echo "🛠️ gcc        : $(gcc --version 2>/dev/null | head -1)"
          echo "🛠️ g++        : $(g++ --version 2>/dev/null | head -1)"
          echo "🐍 python3    : $(python3 --version 2>&1)"
          echo "================================================="

      - name: Free Disk Space (Ubuntu)
        run: |
          echo "📊 强力拆迁前系统总可用空间："
          df -hT
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost /usr/share/swift /usr/lib/jvm /usr/share/miniconda /usr/local/share/chromium
          sudo docker image prune --all --force
          echo "🎉 清理完毕，释放空间如下："
          df -hT

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # 🛡️【史诗级大坑修复4】apt 依赖必须同时兼容 noble(24.04) 与 resolute(26.04)。
          #    26.04 移除了 python2.7 / libncurses5-dev / libncursesw5-dev / libpcre3-dev / p7zip-full，
          #    且把 gnutls-dev 改名为 libgnutls28-dev、mkisofs 改名为 genisoimage、p7zip 改名为 7zip。
          #    若不统一处理，apt-get install 会整条失败，job 会在第一分钟就挂掉。
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y --no-install-recommends \
            eatmydata ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 cargo ccache cdrkit-doc clang cmake cpio curl dejagnu device-tree-compiler \
            dos2unix ecj expect fastjar flex g++ g++-multilib gawk gcc gcc-multilib gettext \
            ghc git golang libgnutls28-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 \
            libelf-dev libfido2-dev libffi-dev libfuse-dev libglib2.0-dev libgmp-dev libgmp3-dev \
            libltdl-dev libltdl7 libmpc-dev libmpfr-dev libncurses-dev libpcre2-dev libpython3-dev \
            libreadline-dev libtext-unidecode-perl libtool libxml-libxml-perl libxml-namespacesupport-perl \
            libxml-sax-base-perl libyaml-dev lld llvm lrzsz luajit luarocks lsb-release make \
            genisoimage msmtp nano ninja-build openjdk-11-jdk 7zip patch pkgconf pybind11-dev \
            python3 python3-dev python3-docutils python3-pip python3-ply python3-pyelftools \
            python3-setuptools qemu-utils re2c rsync ruby-dev rustc scons sgml-base squashfs-tools \
            subversion swig tcl-expect tcl8.6 tex-common texinfo uglifyjs unzip upx-ucl vim wget \
            wodim xmlto xxd zlib1g-dev zstd
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir
          echo "WORK_DIR=/workdir" >> $GITHUB_ENV

      - name: 🔧 Verify Clang supports C++23 (gn 的硬性要求)
        # 🛡️【史诗级大坑修复6】ubuntu-24.04 预装 clang 18、ubuntu-26.04 预装 clang 21，
        #    都原生支持 -std=c++23，根本不需要再装任何 LLVM 官方包。
        #    此前为迁就 ubuntu-22.04 的 clang 14 而折腾 apt.llvm.org + update-alternatives
        #    的整套操作在此全部删掉，连带消灭了三类翻车可能：
        #      ① --install 参数个数写错
        #      ② alternatives 组名与系统已有的 clang 组冲突
        #      ③ 镜像 PATH 里 /usr/lib/llvm-14/bin 排在 /usr/bin 之前导致重定向漏网
        #    另外 apt.llvm.org 也没有 resolute(26.04) 仓库，这条兜底路径本就不可靠。
        #    现在只做「只读自检」：确认 clang++ 真的支持 -std=c++23，
        #    不满足就立刻中止，绝不白跑一小时才在 package 阶段崩掉。
        run: |
          echo "🔍 clang++ 实际指向 : $(readlink -f "$(command -v clang++)" 2>/dev/null)"
          echo "🔍 clang++ 版本     : $(clang++ --version 2>/dev/null | head -1)"
          echo "🔍 gcc 版本         : $(gcc --version 2>/dev/null | head -1)"
          echo "🔍 python3 版本    : $(python3 --version 2>&1)"
          if echo 'int main(){return 0;}' | clang++ -x c++ -std=c++23 - -o /dev/null 2>/dev/null; then
            echo "✅ 自检通过：-std=c++23 可用，gn 可直接编译"
          else
            echo "❌ 致命：clang++ 不支持 -std=c++23，gn 必然编译失败，提前中止！"
            exit 1
          fi

      - name: Clone source code
        working-directory: ${{ env.WORK_DIR }}
        run: |
          df -hT $PWD
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
          ln -sf ${{ env.WORK_DIR }}/openwrt $GITHUB_WORKSPACE/openwrt

      - name: Load custom feeds
        run: |
          [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
          chmod +x $DIY_P1_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH

      - name: Update feeds
        run: cd openwrt && ./scripts/feeds update -a

      - name: Install feeds
        run: cd openwrt && ./scripts/feeds install -a

      - name: 🔧 Patch gn (C++23 → C++2b 兼容补丁)
        run: |
          cd openwrt/feeds/packages/devel/gn
          cp Makefile Makefile.orig
          sed -i 's|^\t$(PYTHON) $(HOST_BUILD_DIR)/build/gen.py|\tsed -i "s/-std=c++23/-std=c++2b/g" $(HOST_BUILD_DIR)/build/gen.py\n\t$(PYTHON) $(HOST_BUILD_DIR)/build/gen.py|' Makefile
          if grep -q 'c++2b' Makefile; then
            echo "✅ gn 兼容补丁已生效：C++23 → C++2b（同一标准草案，等价安全）"
          else
            echo "⚠️ 补丁未生效（上游 Makefile 格式可能已变更），将完全依赖新版 clang 兜底"
            mv Makefile.orig Makefile
          fi

      - name: Load custom configuration
        run: |
          [ -e files ] && mv files openwrt/files
          chmod +x $DIY_P2_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P2_SH

      - name: 📡 Size Radar (探针预警系统：狙击旧皇体重)
        id: check_cache_size
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SIZE_BYTES=$(gh api -X GET /repos/${{ github.repository }}/actions/caches?key=${{ runner.os }}-ubuntu-26.04-openwrt-toolchain-latest | jq -r '.actions_caches[0].size_in_bytes // 0')
          SIZE_MB=$((SIZE_BYTES / 1024 / 1024))
          echo "📊 当前 [ubuntu-26.04] Toolchain 巨怪的具体体重为: ${SIZE_MB} MB"
          if [ "$SIZE_MB" -gt 2500 ]; then
            echo "🚨 触发强制熔断减肥机制！"
            echo "SKIP_TOOLCHAIN=true" >> $GITHUB_ENV
          else
            echo "✅ 体态健康，准许全面接入时空魔法！"
            echo "SKIP_TOOLCHAIN=false" >> $GITHUB_ENV
          fi

      - name: Restore Toolchain Cache
        if: env.SKIP_TOOLCHAIN != 'true'
        uses: actions/cache/restore@v5
        with:
          path: openwrt/staging_dir
          # 🛡️ key 必须带上 Ubuntu 版本 —— 与其它环境的工具链物理隔离，互不污染
          key: ${{ runner.os }}-ubuntu-26.04-openwrt-toolchain-latest

      - name: 📊 Check Toolchain Size (Restore)
        run: |
          echo "📦 [恢复后] Toolchain 实际物理体积："
          if [ -d "${{ env.WORK_DIR }}/openwrt/staging_dir" ]; then
            du -sh ${{ env.WORK_DIR }}/openwrt/staging_dir || true
          else
            echo "⚠️ 目录尚未建立（首轮构建）"
          fi

      - name: Time Magic - Fix Toolchain Timestamps
        if: env.SKIP_TOOLCHAIN != 'true'
        run: |
          if [ -d "openwrt/staging_dir" ]; then
            sudo find openwrt/staging_dir -exec touch -h {} + || true
            echo "🎉 时空欺骗术完成：旧工具箱已被认定为新鲜出厂状态"
          else
            echo "⚠️ 尚未发掘出任何旧有制造机，本次纯靠双手硬撸。"
          fi

      - name: Restore Ccache directory
        uses: actions/cache/restore@v5
        with:
          path: openwrt/.ccache
          key: ${{ runner.os }}-ubuntu-26.04-openwrt-ccache-latest

      - name: 📊 Check Ccache Size (Restore)
        run: |
          echo "📦 [恢复后] Ccache 实际物理体积："
          if [ -d "${{ env.WORK_DIR }}/openwrt/.ccache" ]; then
            du -sh ${{ env.WORK_DIR }}/openwrt/.ccache || true
          else
            echo "⚠️ 目录尚未建立"
          fi

      - name: Prepare & Download (Yashe)
        if: github.event.inputs.build_yashe == 'true'
        run: |
          cd openwrt
          cp $GITHUB_WORKSPACE/.configyashe .config
          echo "CONFIG_DEVEL=y" >> .config
          echo "CONFIG_CCACHE=y" >> .config
          make defconfig
          make download -j16
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -delete

      - name: Prepare & Download (Taiyi)
        if: github.event.inputs.build_taiyi == 'true'
        run: |
          cd openwrt
          cp $GITHUB_WORKSPACE/.configtaiyi .config
          echo "CONFIG_DEVEL=y" >> .config
          echo "CONFIG_CCACHE=y" >> .config
          make defconfig
          make download -j16
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -delete

      - name: Compile the Yashe firmware
        id: compile_yashe
        if: github.event.inputs.build_yashe == 'true'
        run: |
          cd openwrt
          cp $GITHUB_WORKSPACE/.configyashe .config
          echo "CONFIG_DEVEL=y" >> .config
          echo "CONFIG_CCACHE=y" >> .config
          make defconfig
          echo -e "全线满载！强行挂载 $(($(nproc) + 1)) 线程以榨干 CPU 物理算力全力铸造 Yashe 固件..."
          eatmydata make -j$(($(nproc) + 1)) || eatmydata make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Compile the Taiyi firmware
        id: compile_taiyi
        if: github.event.inputs.build_taiyi == 'true'
        run: |
          cd openwrt
          cp $GITHUB_WORKSPACE/.configtaiyi .config
          echo "CONFIG_DEVEL=y" >> .config
          echo "CONFIG_CCACHE=y" >> .config
          make defconfig
          echo -e "全线满载！强行挂载 $(($(nproc) + 1)) 线程以榨干 CPU 物理算力全力铸造 Taiyi 固件..."
          eatmydata make -j$(($(nproc) + 1)) || eatmydata make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Generate timestamp
        run: |
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      - name: Check space usage
        run: df -hT

      - name: Upload bin directory
        if: (steps.compile_yashe.outputs.status == 'success' || steps.compile_taiyi.outputs.status == 'success') && env.UPLOAD_BIN_DIR == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: OpenWrt_bin-ubuntu-26.04${{ env.FILE_DATE }}
          path: openwrt/bin

      - name: Organize ALL output files
        id: organize
        if: (steps.compile_yashe.outputs.status == 'success' || steps.compile_taiyi.outputs.status == 'success') && env.UPLOAD_FIRMWARE == 'true'
        run: |
          cd openwrt/bin/targets/*/*
          # 📦 剔除调试符号
          find . -type f -name "*.debug" -delete
          # 🗜️ 压缩固件
          tar -czf ${{ env.FIRMWARE }}.tar.gz *
          echo "FIRMWARE=${{ env.FIRMWARE }}.tar.gz" >> $GITHUB_ENV
          ls -lh ${{ env.FIRMWARE }}.tar.gz

      - name: Upload firmware directory
        if: steps.organize.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: OpenWrt_firmware-ubuntu-26.04${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}.tar.gz

      - name: Show Ccache Statistics
        if: always()
        run: |
          if [ -d "${{ env.WORK_DIR }}/openwrt/.ccache" ]; then
            echo "📊 Ccache 统计："
            ccache -s 2>/dev/null || true
          fi

      - name: Save Updated Toolchain
        if: always() && steps.compile_yashe.outputs.status == 'success'
        uses: actions/cache/save@v5
        with:
          path: openwrt/staging_dir
          key: ${{ runner.os }}-ubuntu-26.04-openwrt-toolchain-latest

      - name: Save Updated Ccache
        if: always() && steps.compile_yashe.outputs.status == 'success'
        uses: actions/cache/save@v5
        with:
          path: openwrt/.ccache
          key: ${{ runner.os }}-ubuntu-26.04-openwrt-ccache-latest

      - name: Post Checkout
        if: always()
        run: rm -rf openwrt/tmp || true
