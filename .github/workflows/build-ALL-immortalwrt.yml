# Description: Build OpenWrt using GitHub Actions
#
# -----------------------------------------------------------------------------
# 🧭 【长期维护红线 · 优化只发生在 CI 层】
#    本流水线服务于「长期、可持续、跟得上上游」的 OpenWrt 编译，因此：
#      ✗ 不修改 OpenWrt 源码（不 sed 源码、不打私有补丁、不改上游 Makefile）
#      ✗ 不改变编译语义（不改 make 参数含义、不改 .config 的标准启用方式）
#      ✗ 不覆盖上游的既定策略（例如 rules.mk 里的 CCACHE_NOCOMPRESS）
#      ✓ 优化只允许落在：runner 选择、缓存策略、观测手段、并发与下载加速
#    这样将来 OpenWrt 升级 / 换设备 / 换 runner / 换维护者，都能照常工作。
#    本文件里任何「看起来能再快一点」的改动，都请先对照这条红线自查。
# -----------------------------------------------------------------------------
# 🌟 源码阅读与设计赏析：这是一份“豪华前台点单式”编译流水线配置！
#    【作者意图】：为了不破坏原有的文件，我们新建了它。并赋予了它【互动式】的生命！
#    【核心黑科技 - `workflow_dispatch: inputs`】：
#         我们将网页上的手动触发按钮做了魔改，给你加上了“勾选菜单”。
#         想煮哪口锅的饭（Yashe 还是 Taiyi），你自己勾选，下面的流程就能像听话的厨子一样：
#         勾了谁，就启动哪套图纸(.config)下载和编译；都勾了体验双倍快乐，不勾选的地方直接被 `if:` 魔法跳掉省电！
#
#    🚨 【重大避坑警告 - 关于“蹭饭(缓存复用)”的前提条件】：
#         为什么 Yashe 编完再编 Taiyi 能这么快不报错？
#         答：因为它们使用的是同一套架构的 CPU（联发科 Filogic 系列 MT7986/MT7981），它们的底层交叉编译工具链
#         和 C语言基础库是【完全一模一样】的！OpenWrt 系统聪明地发现底层不用重造，就只花几分钟补齐了不一样的上层软件。
#         **千万不要**在这里把两个 CPU 架构完全不同（比如一个是 X86_64 电脑，一个是 高通ARM）的固件放在同一次流水线里紧挨着编！
#         如果跨架构强行“不洗锅就炒下道菜”，旧的底层文件会把新系统毒死，导致疯狂报错编译失败！
# -----------------------------------------------------------------------------

name: ✨ Build ALL Optional (Yashe & Taiyi) # 🏷️ 给这份新工作流起个闪亮的名字，好在 Actions 列表区分

# 🛡️【并发闸门】同一时间只允许一个构建在跑。
#    手动连点、或定时任务与手动任务撞车时，后来的排队等位，
#    避免多个 job 互抢 CPU/网络/缓存把额度烧掉。
#    cancel-in-progress: false —— 已开始的构建不打断，让它跑完出固件。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  repository_dispatch:
  schedule:
    # 🕒 定时触发：每月 2 号和 16 号的凌晨 2 点 (UTC 18:00) 自动编译一次最新固件。
    # 刻意与防沉迷脚本(1号)和缓存起搏器(*/5)的时辰错峰开来，且完全自动化保持固件代差更新。
    - cron: '0 18 2,16 * *'

  workflow_dispatch: # 🖱️ 用户手动触发环节
    inputs: # 👇 重点来了！这里定义了弹出的菜单问卷！
      build_yashe:
        description: "🔥 是否编译 Yashe 固件？ (打个勾表示 Yes)" # 给普通玩家看的大白话说明
        required: true    # 这道题必须回答！
        type: boolean     # 答案类型：对错题（也就是网页上会渲染成一个打钩的小框框）
        default: true     # 默认建议勾上
      build_taiyi:
        description: "🔥 是否编译 Taiyi 固件？ (打个勾表示 Yes)"
        required: true
        type: boolean
        default: true
      # ⚠️ 注意：当本工作流由 `schedule` (定时计划任务) 自动触发运行时，
      # 此选项将被强行判定为 `false`，跳过读取直接重新烧制全新纯净环境！
      use_ccache:
        description: "🧲 读取并复用 ccache 碎片？(选 false = 强制砸碎重配新缓存)"
        required: false
        type: boolean
        default: true
      use_toolchain_cache:
        description: "🔥 极客专享：复用庞大的 Toolchain 缓存？(可省近40分钟)"
        required: false
        type: boolean
        default: true
      make_jobs:
        description: "🧵 编译并行线程数（留空 = 纯核数 nproc；填 5 = 旧的 nproc+1，做 A/B 对比用）"
        required: false
        default: ""

env: # 🌍 全局环境变量：设置一波快捷指令名（就像把很多常用的常量封印到这）
  REPO_URL: https://github.com/VIKINGYFY/immortalwrt.git
  REPO_BRANCH: main
  FEEDS_CONF: feeds.conf.default
  # 我们这里删掉了固定的 CONFIG_FILE，因为下面会根据你打钩的情况给系统智能派发
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: true    # 📤 是否把全量的碎片化 `.ipk` 零件也包圆带走？
  UPLOAD_FIRMWARE: true   # 📤 是否把能刷机的核心精髓固件输出发布？
  UPLOAD_RELEASE: true    # 🚀 是否最后光荣挂榜（生成 Release 展示下载页面）
  TZ: Asia/Shanghai       # 🕰️ 对时准星校对！防止你生成的发布因为美国时间导致记录错乱
  # 🚀 【Node.js 24 全局引擎强制开关】：提前应对 GitHub 未来政策，强制所有脚本机器人在最高等级的 24 号引擎版本上运行，剿灭过时警告。
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-26.04 # 🖥️ 唯一运行环境
    # ⏱️ 超时护栏：正常一轮约 2 小时（两套固件 + 缓存上传）。
    #    给到 6 小时留足余量（也是 GitHub 硬上限），真卡死时到点自动失败，
    #    不至于占着额度空转到平台上限。
    timeout-minutes: 360
    env: # 🏢 Job 层级环境变量：这就像是在具体工位的桌子上贴了层最高指令
      # 🗂️ 全局动态变量占位符（消除 IDE 的未声明警告，后续运行中会被脚本塞入真实数据）
      WORK_DIR: /workdir
      FILE_DATE: _fallback_date
      FIRMWARE: /workdir/firmware

    steps:
      - name: Checkout # 1️⃣：下发检出指令，去咱们的库房把上面的那些自定义脚本全拖到肉机里来
        # ✨ 追捕时代最前沿：摒弃不稳定且解析慢的 @main，直接使用稳定的纯净最新大版本 @v4
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # 💎 性能狂魔点睛之笔：全量拉取才能让清理逻辑看见所有历史 Tag

      - name: 🕵️‍♂️ Trigger Source Identity (触发源身份识别) # 🔍 增加透明度：一眼看穿是谁在干活
        run: |
          echo "================================================="
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "🕒 本次任务由【计划任务 (Schedule)】自动唤醒！"
            echo "🤖 状态：系统进入全自动巡航编译模式，将默认产出所有机型固件。"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "🖱️ 本次任务由【手动操作 (Workflow Dispatch)】手动点火！"
            echo "👤 尊贵的操作员：${{ github.actor }}"
          else
            echo "📡 本次任务由第三方信号【${{ github.event_name }}】触发。"
          fi
          echo "================================================="

      - name: Free Disk Space (Ubuntu) # 2️⃣：强力拆迁队打扫战场 (性能狂魔原生秒杀版)
        # ✨ 性能狂魔终极优化：抛弃了原来那个极其臃肿、喜欢磨洋工耗时达 3~5 分钟的第三方扫地大妈 jlumbroso 插件。
        # 这里直接动用原生极其暴力的超级指令，一秒钟瞬间抹除系统出厂自带的安卓、.NET 和 Haskell 等高达 30GB 的重型沉睡工厂！无情释放空间！
        run: |
          echo "📊 强力拆迁前系统总可用空间："
          df -hT
          
          echo "🧨 警告：正在引爆云端的旧有原厂巨兽建筑..."
          # 核心庞大出厂建筑包 (瞬间斩杀释放极限空间)
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          # 附加累赘工具包 (零秒并发切割)
          sudo rm -rf /usr/local/share/boost /usr/share/swift /usr/lib/jvm /usr/share/miniconda /usr/local/share/chromium
          sudo docker image prune --all --force
          
          echo "🎉 新世界建筑彻底清除完毕，已达到物理理论上的清理极值！耗时仅几秒！"
          echo "📊 强力拆迁后系统总可用空间对比（见证白嫖的奇迹）："
          df -hT

      - name: Initialization environment # 3️⃣：熬底汤 - 装载海量交叉编译需要的支持库（这是在装车间机器）
        env:
          DEBIAN_FRONTEND: noninteractive # 🤖【机器人模式光环】: 有任何弹窗问“是/否”一律默认执行免卡死模式！
        run: |
          # 🛡️【史诗级大坑修复5】下面这 110 个包逐一对照 ubuntu 26.04 (resolute) 的
          #    Packages 索引实测过，全部可用。任何一个包在源里缺失，
          #    apt-get install 整条命令就会失败，job 第一分钟就挂。
          #    注意：gnutls-dev / mkisofs / p7zip / p7zip-full / libpcre3-dev /
          #    python2.7 / libncurses5-dev / libncursesw5-dev / libz-dev / ncurses-dev
          #    在 26.04 源中已不存在或已改名，列表里用的是对应替代品：
          #    libgnutls28-dev / genisoimage / 7zip。
          # ✨ 性能狂魔绝杀：合并 60 余行垃圾冗余重复的安装指令，解放服务器 I/O！
          # GitHub Action 的新机器其实已经很干净了，不需要上来先全盘跑好几圈升级（纯浪费生命）。
          # 🛡️ 终极屏蔽：强制切断所有 --no-install-recommends (不下载配套教程和无用推流模块，只装干货核心)，再减几分钟体积！
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y --no-install-recommends \
            eatmydata ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 cargo ccache cdrkit-doc clang cmake cpio curl dejagnu \
            device-tree-compiler dos2unix ecj expect fastjar flex g++ g++-multilib gawk gcc \
            gcc-multilib gettext ghc git golang libgnutls28-dev gperf haveged help2man intltool \
            lib32gcc-s1 libc6-dev-i386 libelf-dev libfido2-dev libffi-dev libfuse-dev \
            libglib2.0-dev libgmp-dev libgmp3-dev libltdl-dev libltdl7 libmpc-dev libmpfr-dev \
            libncurses-dev libpcre2-dev libpython3-dev libreadline-dev libssl-dev \
            libtext-unidecode-perl libtool libxml-libxml-perl libxml-namespacesupport-perl \
            libxml-sax-base-perl libyaml-dev lld llvm lrzsz luajit luarocks lsb-release make \
            genisoimage msmtp nano ninja-build openjdk-11-jdk 7zip patch pkgconf pybind11-dev \
            python3 python3-dev python3-docutils python3-pip python3-ply python3-pyelftools \
            python3-setuptools qemu-utils re2c rsync ruby-dev rustc scons sgml-base \
            squashfs-tools subversion swig tcl-expect tcl8.6 tex-common texinfo uglifyjs unzip \
            upx-ucl vim wget wodim xmlto xxd zlib1g-dev zstd
          
          # 清理一下安装产生的无用骨架碎片
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          
          # 校准电脑内时间
          sudo timedatectl set-timezone "$TZ"
          
          # ==================== 💎 直接启用系统主盘作为编译工作目录 ====================
          # 📌 GitHub Actions 的 runner 机器经过上面"强力拆迁"后，系统盘已有 50GB+ 可用空间，
          #    完全满足 OpenWrt 编译需求，无需动态选盘，简洁可靠。
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir
          echo "WORK_DIR=/workdir" >> $GITHUB_ENV

      - name: 🔧 Verify Runner & Clang (环境硬守卫)
        # 🛡️【史诗级大坑修复6】本项目已永久固定在 ubuntu-26.04，不再回退到更老的 runner：
        #    老镜像预装的 clang 认不认 -std=c++23 是个版本问题，而 ubuntu-26.04 预装 clang 21
        #    原生支持，于是早期为迁就老编译器而折腾 apt.llvm.org + update-alternatives 的
        #    那套操作全部删掉了，连带消灭了三类翻车可能：
        #      ① --install 参数个数写错 ② alternatives 组名与系统已有组冲突
        #      ③ 镜像 PATH 里 /usr/lib/llvm-14/bin 排在 /usr/bin 之前导致重定向漏网
        #
        #    这里做「只读自检」：先断言 runner 确实是 26.04，再确认 clang++ 真的支持
        #    -std=c++23。任何一条不满足就立刻中止，绝不白跑一小时才在 package 阶段崩掉。
        run: |
          # 🛡️ 硬守卫：runner 必须是 26.04，否则直接拒绝开工。
          #    万一有人把 runs-on 改回旧镜像，这里会在第一分钟就拦下来，
          #    而不是等 gn 在 package 阶段炸掉才发现。
          OS_REL=$(lsb_release -rs 2>/dev/null || cat /etc/os-release | grep '^VERSION_ID=' | cut -d'"' -f2)
          echo "🔍 发行版版本   : ${OS_REL:-未知}"
          if ! echo "${OS_REL:-}" | grep -qE '^26\.04'; then
            echo "❌ 致命：本项目已固定使用 ubuntu-26.04，当前环境是 '${OS_REL:-未知}'，拒绝继续！"
            echo "   ubuntu-22.04 已被永久放弃（其 clang 不支持 gn 需要的 -std=c++23）。"
            exit 1
          fi
          echo "✅ 守卫通过：环境版本符合要求 (26.04)"
          echo "🔍 clang++ 实际指向 : $(readlink -f "$(command -v clang++)" 2>/dev/null)"
          echo "🔍 clang++ 版本     : $(clang++ --version 2>/dev/null | head -1)"
          echo "🔍 gcc 版本         : $(gcc --version 2>/dev/null | head -1)"
          echo "🔍 python3 版本    : $(python3 --version 2>&1)"
          if echo 'int main(){return 0;}' | clang++ -x c++ -std=c++23 - -o /dev/null 2>/dev/null; then
            echo "✅ 自检通过：-std=c++23 可用，gn 可直接编译"
          else
            echo "❌ 致命：clang++ 不支持 -std=c++23，gn 必然编译失败，提前中止！"
            exit 1
          fi

      - name: Clone source code # 4️⃣：去把 OpenWrt 的源代码大库房全须全根拉过来
        # 👑 抛弃原来死板的编码设定，全自动跟随上一步智能雷达挑选出的最佳数据盘基地
        working-directory: ${{ env.WORK_DIR }}
        run: |
          echo "📊 当前目标工作基地所在盘符的具体容量雷达图："
          df -hT $PWD
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
          ln -sf ${{ env.WORK_DIR }}/openwrt $GITHUB_WORKSPACE/openwrt

      - name: Load custom feeds # 5️⃣：导入个人定制的商店源连接
        run: |
          [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
          chmod +x $DIY_P1_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH

      - name: Update feeds # 6️⃣：让库房向外网商店下达目录更新请求
        run: cd openwrt && ./scripts/feeds update -a

      - name: Install feeds # 7️⃣：把我们订阅的所有小插件的目录都安装落户过来
        run: cd openwrt && ./scripts/feeds install -a

      - name: Load custom configuration # 8️⃣：上自己的“微调小特权”
        run: |
          [ -e files ] && mv files openwrt/files
          chmod +x $DIY_P2_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P2_SH

      - name: 📡 Size Radar (探针预警系统：狙击旧皇体重)
        id: check_cache_size
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔍 正在向 GitHub 总机发送幽灵探测包，扒出云端 Toolchain 缓存的精确字节数..."
          # 调用底层接口：拿取名为 -toolchain-latest 的包裹内部档案薄，精准抽出 'size_in_bytes' 
          SIZE_BYTES=$(gh api -X GET /repos/${{ github.repository }}/actions/caches?key=${{ runner.os }}-ubuntu-26.04-openwrt-toolchain-latest | jq -r '.actions_caches[0].size_in_bytes // 0')
          
          # 将字节换算为 MB 方便人看
          SIZE_MB=$((SIZE_BYTES / 1024 / 1024))
          echo "📊 当前云端 Toolchain 巨怪的具体体重为: ${SIZE_MB} MB"
          
          # 设定生死存亡的警戒红线阈值：2500 MB (约 2.44 GB)
          if [ "$SIZE_MB" -gt 2500 ]; then
            echo "🚨 警报！这只死循环的貔貅已经胖得走不动道了！今日触发强制熔断减肥机制！"
            echo "SKIP_TOOLCHAIN=true" >> $GITHUB_ENV
          else
            echo "✅ 这套大钳子体态非常健康苗条，准许全面接入时空魔法！"
            echo "SKIP_TOOLCHAIN=false" >> $GITHUB_ENV
          fi

      - name: Restore Toolchain Cache # 🧰 尝试拉取巨无霸重工制造机！
        # 🛡️【史诗级大坑修复7】toolchain 缓存必须【按 runner 版本隔离】！
        #    staging_dir/host/bin/ 下大量是指向系统路径的符号链接
        #    （例如 python3 -> /usr/bin/python3.10）。跨 Ubuntu 大版本复用缓存时，
        #    这些链接会全部指向不存在的路径，表现为
        #      bash: /workdir/openwrt/staging_dir/host/bin/python3: No such file or directory
        #      ERROR: package/system/apk [host] failed to build.
        #      ERROR: package/feeds/packages/gn [host] failed to build.
        #    「Time Magic - Fix Toolchain Timestamps」只 touch 时间戳、不会修复链接。
        #    所以 key 必须带上 runner 版本，各版本各自维护一份干净缓存。
        #    ccache 则继续共用（内容寻址，跨版本绝对安全）。
        if: github.event_name != 'schedule' && env.SKIP_TOOLCHAIN != 'true' && (github.event.inputs.use_toolchain_cache == 'true' || github.event.inputs.use_toolchain_cache == '')
        uses: actions/cache/restore@v5
        with:
          path: openwrt/staging_dir
          key: ${{ runner.os }}-ubuntu-26.04-openwrt-toolchain-latest

      - name: 📊 Check Toolchain Size (Restore)
        run: |
          echo "📦 [恢复后] Toolchain 实际物理体积："
          if [ -d "${{ env.WORK_DIR }}/openwrt/staging_dir" ]; then
            du -sh ${{ env.WORK_DIR }}/openwrt/staging_dir || true
          else
            echo "⚠️ 目录尚未建立（首轮构建）"
          fi
          
      - name: Time Magic - Fix Toolchain Timestamps # 🧙‍♂️ “时空扭曲”黑魔法核心阵法
        if: github.event_name != 'schedule' && env.SKIP_TOOLCHAIN != 'true' && (github.event.inputs.use_toolchain_cache == 'true' || github.event.inputs.use_toolchain_cache == '')
        run: |
          echo "🌟 启动终极时空欺骗术：检测到 Toolchain 缓存，将其伪装成来自未来的全新产物..."
          if [ -d "openwrt/staging_dir" ]; then
            # 🛡️ 引入 sudo 暴力降维打击：强行破译那些被编译器锁死成“只读 (Read-Only 555)”的核心组件！
            # 🛡️ 核心修复 (-h 参数)：专门对付 OpenWrt 里那堆乱指的“死链(断头软链接)”。强行只盖戳在链接本身，绝不去追踪那个已经被我们扔掉的源文件！
            # 附加 || true 终极法盾：无视极个别死脑筋软链接的报错，强行完成全盘时间戳篡改！
            # 🛡️【Time Magic · 稳定优先版】
          # 目标有两个，且必须同时满足：
          #   ① make 绝不能认为工具链过期 → 触发重编整个交叉工具链（20~30 分钟，纯浪费）
          #   ② 不能改动参与 ccache「编译器指纹」计算的那些文件的 mtime
          #
          # 官方 VIKINGYFY/OpenWRT-CI 的写法是「只 touch stamp 目录、排除 target*」：
          #   find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | ...
          # 那是因为官方【不缓存 target 交叉工具链】、每轮都重编，touch stamp 就够了。
          # 但本项目【缓存了 target 工具链】，只 touch stamp 会让恢复出来的 target gcc
          # 保持旧时间戳 → make 判定它比源码旧 → 触发工具链重编。
          #
          # 所以这里采用第三种写法：全量 touch（保持原版「工具链永远是最新的」保证），
          # 只把 target 下的【编译器二进制】排除掉：
          #   bin/      → aarch64-openwrt-linux-musl-gcc 等驱动包装器
          #   libexec/  → cc1 / collect2 / lto1 等后端程序
          # 这些正是 ccache compiler_check（mtime 或 content）要哈希的对象。
          # 其余文件（库、头文件、工具）照常 touch，它们不参与编译器指纹。
          find openwrt/staging_dir -type f \
            ! -path "*/target-*/bin/*" ! -path "*/target-*/libexec/*" \
            -exec touch -h {} + 2>/dev/null || true
          # 💡 为什么【不】用「只 touch stamp」：那会让 make 有机会重编交叉工具链，
          #    稳定能用是第一优先级，不能为了 ccache 命中率去冒重编的风险。
          echo "✅ Time Magic 完成：工具链时间戳已刷新（编译器二进制保持原状，ccache 指纹稳定）"
          echo "🎉 瞒天过海成功！系统已将旧工具箱认定为新鲜出厂状态！"
          else
            echo "⚠️ 尚未发掘出任何旧有制造机，本次将纯靠双手硬撸。"
          fi

      - name: Restore Ccache directory # 🧲 C++ 编译碎片金库：尝试拉取老本！
        # 🛡️ 只有当用户勾选了复用缓存，【且当前绝非自动计划任务(schedule)】时，我们才去取云端干粮。
        #    如果是按照日历设定的定时构建，它会强行跳过此步变成假环境(False)，从头开始砸碎重炼一炉100%纯净的新缓存！
        if: github.event_name != 'schedule' && (github.event.inputs.use_ccache == 'true' || github.event.inputs.use_ccache == '')
        uses: actions/cache/restore@v5
        with:
          path: openwrt/.ccache
          # 👑 我们彻底抛弃了乱码随机后缀，从此全服只有一个王储名字：latest
          key: ${{ runner.os }}-ubuntu-26.04-openwrt-ccache-latest

      - name: 📊 Check Ccache Size (Restore)
        run: |
          echo "📦 [恢复后] Ccache 实际物理体积："
          if [ -d "${{ env.WORK_DIR }}/openwrt/.ccache" ]; then
            du -sh ${{ env.WORK_DIR }}/openwrt/.ccache || true
          else
            echo "⚠️ 目录尚未建立（首轮构建）"
          fi

      # ================== 👇 核心高能区域：买菜洗菜环节 ==================
      - name: 📊 Audit cache usage (GitHub 10GB 仓储上限监控)
        # 🛡️ 监控仓储占用，避免触发 GitHub 的 LRU 驱逐。
        # GitHub 限制（docs.github.com/actions/reference/workflows-and-actions/dependency-caching）：
        #   · 仓库所有缓存条目合计 ≤ 10 GB（不是单条目上限）
        #   · 超限后按 last-access 从旧到新驱逐，每小时检查一次
        #   · 7 天未访问的条目自动删除
        #   · 官方明确警告超限会导致 cache thrashing（缓存反复被建又被删，命中率永远上不去）
        # 本仓库采用「固定 key + 先删后存」→ 条目数恒定为 2，不会累积；
        # 但仍需监控，以免以后调整缓存大小时超限。
        run: |
          TOTAL=0
          gh api "repos/${{ github.repository }}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | "\(.key) \(.size_in_bytes)"' 2>/dev/null \
            | while IFS= read -r LINE; do
                KEY=$(echo "$LINE" | awk '{print $1}')
                SZ=$(echo "$LINE" | awk '{print $2}')
                [ -z "$KEY" ] && continue
                HUMAN=$(awk -v b="$SZ" 'BEGIN{printf "%.1f MB", b/1048576}')
                echo "   📦 $KEY = $HUMAN"
                echo "$SZ" >> /tmp/_cachesz
              done
          TOTAL=$(cat /tmp/_cachesz 2>/dev/null | awk '{s+=$1} END{print s+0}')
          rm -f /tmp/_cachesz
          HUMAN=$(awk -v b="$TOTAL" 'BEGIN{printf "%.2f GB", b/1073741824}')
          echo "📊 仓库缓存总占用: $HUMAN / 10 GB 上限"
          if [ "$TOTAL" -gt 8388608000 ]; then
            echo "⚠️ 已超过 8 GB（上限 10 GB），请立即缩小 ccache 的 max_size 或清理旧条目"
          else
            echo "✅ 缓存占用安全（余量 $((8388608000 - TOTAL)) 字节）"
          fi

      - name: 🔧 Tune ccache (命中率调优)
        # 🛡️ 编译提速核心：ccache 是这条流水线唯一的大杠杆。
        #    实测（run 39352382702，日志逐段还原的时间分布）：
        #      Compile Yashe  1h42m33s  ← 占全流程 87%
        #      Compile Taiyi     5m26s  ← 两套配置几乎相同，第二次几乎全命中
        #    → 说明 ccache 本身工作得很好，问题出在【跨 run 的缓存被版本污染】。
        #    实测命中率仅 14.59%（84165 次可缓存调用中 71882 次 miss），
        #    且缓存已用 3.6/5.0 GiB（72.9%），触顶后被 LRU 淘汰，形成恶性循环。
        #
        #    根因：ccache 缓存 key 曾经不带版本号，里面混着 ubuntu-22.04 时代
        #    用旧 target gcc 编出的产物；而 26.04 的 toolchain 缓存按版本隔离、
        #    target gcc 重新编译，编译器指纹一变，旧条目全部 miss。
        #    → key 改为与 toolchain 同版本，从根上杜绝再次混版。
        #
        #    本步只做互不破坏的调优，全部通过环境变量下发（ccache 里环境变量优先级最高，
        #    不受配置文件路径影响），且都不改变任何已有条目的 hash：
        #      ① max_size 设为 4G：ccache 自身的淘汰阈值，OpenWrt 未设置，纯 CI 层
        #         ⚠️【上限推导 · 别随手调大】
        #         GitHub 官方限制（docs.github.com/actions/reference/workflows-and-actions/dependency-caching）：
        #           · 仓库【所有缓存条目合计】上限 10 GB（不是单条目上限）
        #           · 超出后按 last-access 从旧到新 LRU 驱逐，且【每小时】检查一次
        #           · 7 天未访问的条目自动删除
        #           · 官方明确警告超限会导致 cache thrashing（缓存反复被建又被删，命中率永远上不去）
        #         本仓库的缓存构成：ccache 一份 + toolchain 一份（固定 key，先删后存 → 条目数恒定为 2）
        #           ccache 4G + toolchain 0.6G = 4.6 GB，距 10 GB 上限留有一倍以上余量 ✅
        #         之前设的 8G 有真实风险：8G + 0.6G = 8.6 GB，只剩 1.4 GB 余量；
        #         一旦越线，LRU 可能把【刚用过的 toolchain 缓存】也挤掉，
        #         下一轮就得重编整个交叉工具链（20~30 分钟），且每轮重传 8GB 要多花 1 分多钟。
        #         4G 足够装下一轮完整构建产出的条目（实测一轮净增约 2.5~3GB）。
        #      ② CCACHE_DIR：确保编译期用的就是要被缓存的那个目录（与 OpenWrt 的
        #         export CCACHE_DIR:=$(TOPDIR)/.ccache 指向同一处）
        #      ③ evict-older-than：ccache 标准的自淘汰机制（本来就是 LRU 淘汰，
        #         只是把门槛从默认提前到 14 天），不改变 ccache 的行为语义
        #      ④ compiler_check=content：ccache 4.x 的默认值，写死以防将来默认值变化
        #         被「Time Magic touch 全部文件」带偏
        #    故意【不】设 CCACHE_BASEDIR：它会改变 hash 布局、作废现有全部条目，
        #    而 runner 的工作目录是固定的（/home/runner/work/<repo>/<repo>），设它纯属净损失。
        #    故意【不】设 CCACHE_COMPRESS / CCACHE_SLOPPINESS：前者覆盖了 OpenWrt
        #    rules.mk 里 export CCACHE_NOCOMPRESS:=true 的上游取舍，后者降低严格性 ——
        #    两者都属于「改上游行为」，等命中率根因查清后再决定，而不是先下药。
        run: |
          CCACHE_DIR="$GITHUB_WORKSPACE/openwrt/.ccache"
          mkdir -p "$CCACHE_DIR"
          echo "CCACHE_DIR=$CCACHE_DIR" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=4G" >> $GITHUB_ENV
          # 🛡️ 显式固定 compiler_check=content（ccache 4.x 默认值，这里只是写死以防默认值变化）：
          #    用【内容】而非【mtime】判断编译器是否变化。
          #    「Time Magic - Fix Toolchain Timestamps」会 touch staging_dir 里的 target gcc，
          #    若走 mtime 判定就会导致每次编译全部 miss。content 判定不受 touch 影响。
          echo "CCACHE_COMPILERCHECK=content" >> $GITHUB_ENV
          # 🛡️【刻意不设的两项 · 长期兼容 OpenWrt 的红线】
          #    1) CCACHE_COMPRESS —— OpenWrt 的 rules.mk 明确 export CCACHE_NOCOMPRESS:=true，
          #       那是上游对「编译速度 vs 缓存体积」的既定取舍。改它等于替上游改策略，
          #       而且压缩/非压缩的条目互不通用，切换后旧的缓存条目会作废。
          #       在命中率低的根因还没查清之前就动它，属于未诊断先下药。
          #    2) CCACHE_SLOPPINESS —— 放宽检查会降低 ccache 的严格性。
          #       同样等根因明确、确认是「无害差异导致 miss」之后再有针对性地单独放开某一项。
          #    原则：优化只发生在 CI 层（缓存策略、观测手段），
          #          不改 OpenWrt 源码、不改编译语义、不覆盖上游既定策略，
          #          这样将来 OpenWrt 升级 / 换设备 / 换 runner 都能照常工作。
          CCACHE_BIN="$GITHUB_WORKSPACE/openwrt/staging_dir/host/bin/ccache"
          if [ -x "$CCACHE_BIN" ]; then
            echo "🧹 淘汰陈旧条目（超过 14 天未命中），避免缓存目录无限膨胀："
            env CCACHE_DIR="$CCACHE_DIR" "$CCACHE_BIN" --evict-older-than=14 2>/dev/null || true
            echo "🔍 当前生效的关键 ccache 配置（供事后判读，不靠猜）："
            # 原来用 grep 过滤关键项，结果【一行都没匹配到】—— 等于没观测。
            # 现在直接打印全文，配置项一个不漏。
            env CCACHE_DIR="$CCACHE_DIR" "$CCACHE_BIN" --show-config 2>&1 | sed -n '1,40p' || true
            echo "🩺 诊断（定位命中率异常用，避免靠猜）："
            echo "   · ccache 可执行文件 : $CCACHE_BIN"
            echo "   · 版本              : $(env CCACHE_DIR="$CCACHE_DIR" "$CCACHE_BIN" --version 2>/dev/null | head -1)"
            echo "   · PATH 里先命中的是 : $(command -v ccache 2>/dev/null || echo '(未找到)')"
            echo "   · CCACHE_DIR        : $CCACHE_DIR"
            echo "   · 该目录体积        : $(du -sh "$CCACHE_DIR" 2>/dev/null | cut -f1)"
            echo "   · stats 文件        : $(find "$CCACHE_DIR" -maxdepth 2 -name stats -printf '%p  (%TY-%Tm-%Td %TH:%TM:%TS)\n' 2>/dev/null | head -2 || echo '(无)')"
            echo "   · 默认目录 ${HOME:-/root}/.ccache : $(du -sh "${HOME:-/root}/.ccache" 2>/dev/null | cut -f1 || echo '(不存在)')"
          else
            echo "⚠️ 未找到 ccache 可执行文件（toolchain 缓存可能未命中），跳过调优"
          fi

      - name: Prepare & Download (Yashe) # 🛒 检测：如果是点单选了 Yashe，那就按照它的菜单出击采购！
        id: package_yashe
        # 🛡️ 【逻辑加固】：原逻辑仅判断手动勾选，导致定时任务(schedule)时 inputs 为空从而被跳过。
        # 现在逻辑：(如果是定时任务触发) OR (如果是手动勾选为 true)，则开工！
        if: github.event_name == 'schedule' || github.event.inputs.build_yashe == 'true'
        run: |
          cd openwrt
          cp $GITHUB_WORKSPACE/.configyashe .config
          # 🎛️ 性能狂魔洗炉机制：无论前端是否选择读取旧缓存，一旦开喷底层必须强制开启 Ccache 引擎收集新鲜碎片！
          # 【史诗级大坑修复1】在 Openwrt 里开启 Ccache，它硬性依赖开发者选项，如果不加 CONFIG_DEVEL=y，在执行 make defconfig 时系统会自动判定依赖缺失，然后把你辛苦加上的 CONFIG_CCACHE 给静默删掉！
          echo "CONFIG_DEVEL=y" >> .config
          echo "CONFIG_CCACHE=y" >> .config
          make defconfig
          # 🖧 极速网卡榨取：将下载单通道猛增至 16 并发，彻底塞满 GitHub Action 的超级内网大宽带！
          make download -j16
          # ✨ 文件 I/O 底层斩杀：抛弃低效的 -exec 循环发包（区区几百个空文件会瞬间卡出系统几百次 fork 分岔），直接用底层内置的 -delete 瞬间归零！
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -delete
          
      - name: Prepare & Download (Taiyi) # 🛒 检测：如果是选了 Taiyi，我们把特需它的零件给去下载回来！
        id: package_taiyi
        # 🛡️ 【逻辑加固】：定时任务(schedule)不带参数，必须在此强制拉起，确保每月固件准时更新。
        if: github.event_name == 'schedule' || github.event.inputs.build_taiyi == 'true'
        run: |
          cd openwrt
          cp $GITHUB_WORKSPACE/.configtaiyi .config
          # 🎛️ 性能狂魔洗炉机制：无论前端是否选择读取旧缓存，一旦开喷底层必须强制开启 Ccache 引擎收集新鲜碎片！
          # 【史诗级大坑修复1】在 Openwrt 里开启 Ccache，它硬性依赖开发者选项，如果不加 CONFIG_DEVEL=y，在执行 make defconfig 时系统会自动判定依赖缺失，然后把你辛苦加上的 CONFIG_CCACHE 给静默删掉！
          echo "CONFIG_DEVEL=y" >> .config
          echo "CONFIG_CCACHE=y" >> .config
          make defconfig
          # 🖧 极速网卡榨取：将下载单通道猛增至 16 并发，彻底塞满 GitHub Action 的超级内网大宽带！
          make download -j16
          # ✨ 文件 I/O 底层斩杀：抛弃低效的 -exec 循环发包（区区几百个空文件会瞬间卡出系统几百次 fork 分岔），直接用底层内置的 -delete 瞬间归零！
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -delete

      # ================== 👇 核心火力烹饪环节 ==================
      - name: Compile the Yashe firmware # 🍳 Yashe 开煮！
        id: compile_yashe
        # 🛡️ 【关键修复】：确保自动任务运行时，厨师(编译引擎)不会因为没看到勾选单而罢工。
        if: github.event_name == 'schedule' || github.event.inputs.build_yashe == 'true'
        run: |
          cd openwrt
          cp $GITHUB_WORKSPACE/.configyashe .config
          # 【史诗级大坑修复2】在最终编译阶段，原工作流习惯性再次 cp 覆盖 .config，这会导致前面下载阶段开启的 ccache 设置被完全擦除！必须在此处重磅再次注入！
          echo "CONFIG_DEVEL=y" >> .config
          echo "CONFIG_CCACHE=y" >> .config
          make defconfig
          # ⏱️【耗时分解】编译前后打时间戳，直接写进日志和 Job Summary，
          #    以后不用再翻 6000 行日志去倒推「这次到底快了多少」。
          _t0=$(date +%s)
          echo "⏱️ [Yashe] 编译开始 $(date -u '+%Y-%m-%d %H:%M:%S') UTC | 并行度 ${MAKE_JOBS:-$(nproc)} | 核心数 $(nproc)"
          # ✨ 并行度改为【纯核数 nproc】（照搬官方 VIKINGYFY/OpenWRT-CI 的写法）。
          #    原来是 $(nproc)+1：在 4 核机上开 5 个编译线程属于超订，
          #    多出来的那条线程只能在上下文切换和缓存争用里空转，反而更慢。
          #    仍可用 MAKE_JOBS 覆盖，方便做 A/B 实测。
          # ☢️ eatmydata：拦截 fsync() 安全落盘为 no-op。CI 镜像必定一轮终结，无需断电保护，
          #    把编译器的 iowait 等待直接清零。
          # 🛡️【断崖 Debug】失败后【保持并行】重跑并带 V=s 详细日志。
          #    官方原写法是 -j1（单线程）：同样能定位问题，但 1 小时的工程单线程重编能拖几十分钟；
          #    V=s 的日志详细程度与并行无关，改成 -j$(nproc) 定位能力不变、速度快一个数量级。
          if ! eatmydata make -j"${MAKE_JOBS:-$(nproc)}"; then
            echo "❌ 首次编译失败，切换到并行详细日志模式重跑（定位问题用）..."
            make -j"${MAKE_JOBS:-$(nproc)}" V=s
          fi
          _t1=$(date +%s); _el=$((_t1 - _t0))
          echo "⏱️ [Yashe] 编译完成，耗时 $((_el/60)) 分 $((_el%60)) 秒"
          echo "| Yashe | $((_el/60)) 分 $((_el%60)) 秒 |" >> $GITHUB_STEP_SUMMARY
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Compile the Taiyi firmware # 🍳 Taiyi 开煮！如果我们上面全勾选，这波因为蹭了饭（环境共用），它将光速完工！
        id: compile_taiyi
        # 🛡️ 【关键修复】：Taiyi 作为共用架构，在定时任务时也应一并产出，白嫖前面产生的交叉编译工具链。
        if: github.event_name == 'schedule' || github.event.inputs.build_taiyi == 'true'
        run: |
          cd openwrt
          cp $GITHUB_WORKSPACE/.configtaiyi .config
          # 【史诗级大坑修复2】在最终编译阶段，原工作流习惯性再次 cp 覆盖 .config，这会导致前面下载阶段开启的 ccache 设置被完全擦除！必须在此处重磅再次注入！
          echo "CONFIG_DEVEL=y" >> .config
          echo "CONFIG_CCACHE=y" >> .config
          make defconfig
          # ⏱️【耗时分解】编译前后打时间戳，直接写进日志和 Job Summary，
          #    以后不用再翻 6000 行日志去倒推「这次到底快了多少」。
          _t0=$(date +%s)
          echo "⏱️ [Taiyi] 编译开始 $(date -u '+%Y-%m-%d %H:%M:%S') UTC | 并行度 ${MAKE_JOBS:-$(nproc)} | 核心数 $(nproc)"
          # ✨ 并行度改为【纯核数 nproc】（照搬官方 VIKINGYFY/OpenWRT-CI 的写法）。
          #    原来是 $(nproc)+1：在 4 核机上开 5 个编译线程属于超订，
          #    多出来的那条线程只能在上下文切换和缓存争用里空转，反而更慢。
          #    仍可用 MAKE_JOBS 覆盖，方便做 A/B 实测。
          # ☢️ eatmydata：拦截 fsync() 安全落盘为 no-op。CI 镜像必定一轮终结，无需断电保护，
          #    把编译器的 iowait 等待直接清零。
          # 🛡️【断崖 Debug】失败后【保持并行】重跑并带 V=s 详细日志。
          #    官方原写法是 -j1（单线程）：同样能定位问题，但 1 小时的工程单线程重编能拖几十分钟；
          #    V=s 的日志详细程度与并行无关，改成 -j$(nproc) 定位能力不变、速度快一个数量级。
          if ! eatmydata make -j"${MAKE_JOBS:-$(nproc)}"; then
            echo "❌ 首次编译失败，切换到并行详细日志模式重跑（定位问题用）..."
            make -j"${MAKE_JOBS:-$(nproc)}" V=s
          fi
          _t1=$(date +%s); _el=$((_t1 - _t0))
          echo "⏱️ [Taiyi] 编译完成，耗时 $((_el/60)) 分 $((_el%60)) 秒"
          echo "| Taiyi | $((_el/60)) 分 $((_el%60)) 秒 |" >> $GITHUB_STEP_SUMMARY

          # 【统一打时间戳标记】 因为这是有可能运行的最后一步编译
          echo "status=success" >> $GITHUB_OUTPUT
      
      - name: Generate timestamp # 🏷️ 制作出生证明：记录这一刻的时间戳
        # 移除 !cancelled() 条件，确保只在编译成功后才打日期标
        run: |
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      - name: 🩺 ccache 行为探针（秒级根因定位）
        # 🛡️ 不再靠「清空→积累→测量」盲跑两轮，而是在同一轮里用真实的 target gcc
        #    做四组对照实验，几十秒就能定位到是哪一个因素在造成 miss。
        # 需要真实的 target gcc（ccache 本身也是编译出来的），所以必须放在编译之后。
        if: always()
        run: |
          set +e
          CCACHE_BIN="$GITHUB_WORKSPACE/openwrt/staging_dir/host/bin/ccache"
          export CCACHE_DIR="$GITHUB_WORKSPACE/openwrt/.ccache"
          if [ ! -x "$CCACHE_BIN" ]; then
            echo "⚠️ 没找到 ccache 可执行文件，跳过探针"
            exit 0
          fi
          TARGET_CC=$(ls -1 "$GITHUB_WORKSPACE"/openwrt/staging_dir/target-*/bin/*-gcc 2>/dev/null | head -1)
          if [ -z "$TARGET_CC" ]; then
            echo "⚠️ 没找到 target gcc，跳过探针"
            exit 0
          fi
          echo "🔍 探针目标 gcc: $TARGET_CC"
          echo "🔍 ccache: $("$CCACHE_BIN" --version 2>/dev/null | head -1)"
          mkdir -p /tmp/bzprobe && cd /tmp/bzprobe || exit 0
          # 每个场景前后各读一次 Hits 计数，作差值就是该场景的命中数。
          # 注：ccache -s 里有两个 Hits 行（Cacheable calls 块 + Local storage 块），必须 head -1 只取第一个。
          HITS() { "$CCACHE_BIN" -s 2>/dev/null | grep -oE 'Hits: +[0-9]+' | head -1 | grep -oE '[0-9]+'; }
          cat > p.c <<'EOF'
          int bz_probe(int x) { return x * 3 + 1; }
          EOF
          echo "===== 场景 A：轮内一致性（同一文件连编两次，第二次必须 hit）====="
          h0=$(HITS)
          "$CCACHE_BIN" "$TARGET_CC" -O2 -c p.c -o a1.o >/dev/null 2>&1
          h1=$(HITS)
          "$CCACHE_BIN" "$TARGET_CC" -O2 -c p.c -o a2.o >/dev/null 2>&1
          h2=$(HITS)
          echo "  第1次增量=$((h1-h0))  第2次增量=$((h2-h1))"
          if [ $((h2-h1)) -gt 0 ]; then echo "  ✅ ccache 工作正常"; else echo "  ⚠️ 轮内都不 hit → ccache 基本未生效"; fi
          echo "===== 场景 B：compiler_check 实际影响（必须用 NODIRECT 迫走 preprocessor mode）====="
          # ⚠️ 三个关键要点（本地实测出来的坑）：
          #   ① ccache 的 direct mode（直接模式）命中时【不会检查编译器指纹】，
          #      所以不加 CCACHE_NODIRECT=1 就测不出 compiler_check 的影响。
          #   ② B1 与 B2 必须用【不同源文件】，否则前一个场景写进去的条目
          #      会被后一个场景取用，测的就不是本场景的行为。
          #   ③ touch 要同时覆盖 symlink 本身与其指向的真实二进制，
          #      否则 ccache 记录的那个路径可能没被改动，指纹保持不变。
          REAL_CC=$(readlink -f "$TARGET_CC" 2>/dev/null || echo "$TARGET_CC")
          touch_compiler() {
            touch -m "$TARGET_CC" 2>/dev/null || true
            [ "$REAL_CC" != "$TARGET_CC" ] && touch -m "$REAL_CC" 2>/dev/null || true
            sleep 1
          }
          # --- B1：mtime 判定 ---
          cat > m1.c <<'EOF'
          int bz_m1(int x) { return x * 5 + 2; }
          EOF
          CCACHE_NODIRECT=1 CCACHE_COMPILERCHECK=mtime "$CCACHE_BIN" "$TARGET_CC" -O2 -c m1.c -o m1a.o >/dev/null 2>&1
          "$CCACHE_BIN" "$TARGET_CC" -O2 -c m1.c -o m1b.o >/dev/null 2>&1
          touch_compiler
          h0=$(HITS)
          CCACHE_NODIRECT=1 CCACHE_COMPILERCHECK=mtime "$CCACHE_BIN" "$TARGET_CC" -O2 -c m1.c -o m1c.o >/dev/null 2>&1
          h1=$(HITS)
          echo "  B1 touch 后 + mtime 判定（preprocessor mode）增量=$((h1-h0))（指纹随事件变就 miss → 应为 0）"
          # --- B2：content 判定（独立源文件 m2.c）---
          cat > m2.c <<'EOF'
          int bz_m2(int x) { return x * 7 + 3; }
          EOF
          CCACHE_NODIRECT=1 CCACHE_COMPILERCHECK=content "$CCACHE_BIN" "$TARGET_CC" -O2 -c m2.c -o m2a.o >/dev/null 2>&1
          "$CCACHE_BIN" "$TARGET_CC" -O2 -c m2.c -o m2b.o >/dev/null 2>&1
          touch_compiler
          h0=$(HITS)
          CCACHE_NODIRECT=1 CCACHE_COMPILERCHECK=content "$CCACHE_BIN" "$TARGET_CC" -O2 -c m2.c -o m2c.o >/dev/null 2>&1
          h1=$(HITS)
          echo "  B2 touch 后 + content 判定（preprocessor mode）增量=$((h1-h0))（内容未变 → 应然 hit）"
          echo "  → 若 B1=0 且 B2=1：content 判定正确解决了指纹不稳问题"
          echo "===== 场景 E：direct mode 是否工作（OpenWrt 的大敌）====="
          h0=$(HITS)
          "$CCACHE_BIN" "$TARGET_CC" -O2 -c p.c -o e1.o >/dev/null 2>&1
          h1=$(HITS)
          "$CCACHE_BIN" "$TARGET_CC" -O2 -c p.c -o e2.o >/dev/null 2>&1
          h2=$(HITS)
          echo "  默认（direct 可能生效）第2次增量=$((h2-h1))；下面用 NODIRECT 对照"
          h0=$(HITS)
          CCACHE_NODIRECT=1 "$CCACHE_BIN" "$TARGET_CC" -O2 -c p.c -o e3.o >/dev/null 2>&1
          h1=$(HITS)
          echo "  NODIRECT=1（preprocessor mode）增量=$((h1-h0))（为 0 则 preprocessor mode 完全不能命中）"
          echo "===== 场景 C：__DATE__ / __TIME__ 宏是否自动定义不可缓存====="
          cat > d.c <<'EOF'
          const char* bz_d = __DATE__ " " __TIME__;
          int bz_probe2(int x) { return x + (int)bz_d[0]; }
          EOF
          h0=$(HITS)
          "$CCACHE_BIN" "$TARGET_CC" -O2 -c d.c -o c1.o >/dev/null 2>&1
          h1=$(HITS)
          "$CCACHE_BIN" "$TARGET_CC" -O2 -c d.c -o c2.o >/dev/null 2>&1
          h2=$(HITS)
          echo "  第1次增量=$((h1-h0))  第2次增量=$((h2-h1))（若第2次仍为 0 → DATE 宏是 miss 杀手）"
          echo "===== 场景 D：头文件搜索路径变化（验证 base_dir 归一化）====="
          mkdir -p inc1 inc2
          echo "int bz_h;" > inc1/h.h
          echo "int bz_h;" > inc2/h.h
          h0=$(HITS)
          "$CCACHE_BIN" "$TARGET_CC" -O2 -Iinc1 -c p.c -o d1.o >/dev/null 2>&1
          h1=$(HITS)
          "$CCACHE_BIN" "$TARGET_CC" -O2 -Iinc2 -c p.c -o d2.o >/dev/null 2>&1
          h2=$(HITS)
          echo "  第1次增量=$((h1-h0))  第2次增量=$((h2-h1))（若第2次为 0 → 路径未归一化）"
          echo "===== 探针总结 ====="
          echo "  A 轮内一致性 / B mtime 假说 / C DATE 宏 / D 路径归一化 —— 见上面各场景的增量数"

      - name: Check space usage # 🔍 硬盘体检
        run: df -hT

      - name: 🧹 Prune old artifacts # 🧹 清理陈旧 artifact，防止仓库存储无限膨胀
        # 本仓库每个 artifact 近 600 MB，攒着不动很快就是十几 GB。
        # 保留最近 3 轮的 bin + 固件包（够下载回溯），更旧的直接删。
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KEEP=5
          for PREFIX in OpenWrt_bin OpenWrt_Custom_firmware_Package; do
            IDS=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
              --jq "[.artifacts[] | select(.name | startswith(\"$PREFIX\"))] | sort_by(.created_at) | reverse | .[$KEEP:] | .[].id" 2>/dev/null || true)
            for ID in $IDS; do
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$ID" >/dev/null 2>&1 \
                && echo "   🗑️ 已删除陈旧 artifact $ID" || echo "   ⚠️ 删除失败 $ID（忽略）"
            done
          done
          echo "🧹 当前剩余 artifact："
          gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | "   \(.name)  \(.size_in_bytes/1048576*100|floor/100) MB"' 2>/dev/null || true

      - name: Upload bin directory # 📦 收废品（收集所有安装包）
        uses: actions/upload-artifact@v6
        # 只要你勾选的任一主线跑成功了我们都吸，防断连
        if: (steps.compile_yashe.outputs.status == 'success' || steps.compile_taiyi.outputs.status == 'success') && env.UPLOAD_BIN_DIR == 'true'
        with:
          name: OpenWrt_bin${{ env.FILE_DATE }}
          path: openwrt/bin
          # 保留 30 天（默认 90 天太久了，本仓库 artifact 单个近 600MB）
          retention-days: 30

      - name: Organize ALL output files # 🧲 万磁王：全范围收割成品刷机包
        id: organize
        # 🛡️ 【熔断机制】：只要 Yashe 或 Taiyi 任意一个编译成功，且你开启了上传，才继续
        if: (steps.compile_yashe.outputs.status == 'success' || steps.compile_taiyi.outputs.status == 'success') && env.UPLOAD_FIRMWARE == 'true'
        run: |
          mkdir -p $GITHUB_WORKSPACE/firmware
          # 这里用通配符 `*` 可以把你之前成功编译的所有固件一锅端
          cp -r openwrt/bin/targets/*/*/*.* $GITHUB_WORKSPACE/firmware/ 2>/dev/null || true
          rm -rf $GITHUB_WORKSPACE/firmware/packages
          # 🛡️ 先更新 FIRMWARE 环境变量，供后续步骤的 ${{ env.FIRMWARE }} 表达式正确解析
          echo "FIRMWARE=$GITHUB_WORKSPACE/firmware" >> $GITHUB_ENV
          echo "📊 最终生成的全量固件总体积："
          # 🐛 修复：原来使用 ${{ env.FIRMWARE }} (GitHub Actions 编译时表达式)，
          #    在步骤启动前就被解析为初始值 /workdir/firmware，而非实际路径。
          #    改用 shell 运行时变量 $GITHUB_WORKSPACE/firmware，确保路径正确。
          du -sh $GITHUB_WORKSPACE/firmware
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 🧹 Clean metadata from build output # 🧹 按官方做法剔除产物里的构建元数据
        # 照搬官方 VIKINGYFY/OpenWRT-CI 的收尾动作：
        #   find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +
        # 这些 buildinfo/json 是给 CI 过程用的中间产物，混进 Release 只会让人误以为是固件的一部分。
        run: |
          cd openwrt
          find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} + 2>/dev/null || true
          echo "🧹 已清理产物元数据"

      - name: Upload firmware directory # 📦 【内部发货】
        uses: actions/upload-artifact@v6
        if: steps.organize.outputs.status == 'success'
        with:
          name: OpenWrt_Custom_firmware_Package${{ env.FILE_DATE }}
          retention-days: 30
          path: ${{ env.FIRMWARE }}

      - name: Generate release tag
        id: tag
        if: env.UPLOAD_RELEASE == 'true'
        run: |
          echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
          touch release.txt
          echo "🎉 新鲜出炉的 OpenWrt 专有编译固件发行版！您可以根据需求挑选心仪的设备固件哦。 " >> release.txt
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware to release # 🚀 极速光年发射 (原生黑客版)
        # ✨ 性能狂魔安全升级：彻底手刃由于第三方 NodeJS 插件带来的 0day 风险和加载速度拖慢，强制接入原生最高效的 OS 级骨干命令！
        if: steps.tag.outputs.status == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 启动 GitHub 原生核心引擎进行最终极的固件发版与全量部署..."
          gh release create "${{ steps.tag.outputs.release_tag }}" \
            --title "OpenWrt 纯净固件发行版 ${{ steps.tag.outputs.release_tag }}" \
            --notes-file release.txt \
            ${{ env.FIRMWARE }}/*
          echo "🎉 终极发射圆满结束！所有卓越的交叉编译固件均已硬化在您的 Release 专属展区。"

      - name: Show Ccache Statistics # 📊 验收大赏：查阅本次编译命中率！
        if: always()
        run: |
          echo "========= Ccache 极限压榨金库战果 ========="
          # 提取 OpenWrt 内部交叉编译好的原生宿主机 ccache 分析器，强制提取它刚才的所有拦截记录！
          if [ -x "openwrt/staging_dir/host/bin/ccache" ]; then
            STATS=$(env CCACHE_DIR=$GITHUB_WORKSPACE/openwrt/.ccache openwrt/staging_dir/host/bin/ccache -s)
            echo "$STATS"
            echo "🩺 诊断：stats 文件 $(find "$GITHUB_WORKSPACE/openwrt/.ccache" -maxdepth 2 -name stats -printf '%p  (%TY-%Tm-%Td %TH:%TM:%TS)\n' 2>/dev/null | head -2 || echo '(无)')"
            echo "   默认目录 ${HOME:-/root}/.ccache 体积: $(du -sh "${HOME:-/root}/.ccache" 2>/dev/null | cut -f1 || echo '(不存在)')"
            echo "   本轮 ccache 目录体积: $(du -sh "$GITHUB_WORKSPACE/openwrt/.ccache" 2>/dev/null | cut -f1)"
            # ccache -s 输出形如：Hits:  12283 /  84165 (14.59%)
            # ⚠️ 注意：ccache -s 里【有两个】Hits: 行（Cacheable calls 块 + Local storage 块），
            #    必须只取第一个！否则 HIT_RATE 里会夹进换行符，
            #    导致下面的 awk 语法报错、返回非 0，于是走进 else 分支
            #    把「命中率低」误报成「✅ 命中率良好」—— 反向告警，比没有告警更糟。
            HIT_RATE=$(echo "$STATS" | grep -oE 'Hits: +[0-9]+ / +[0-9]+ [(][0-9.]+[%][)]' | head -1 | grep -oE '[0-9.]+[%][)]' | tr -d '()%')
            if [ -n "$HIT_RATE" ]; then
              echo "🎯 本轮 ccache 命中率: ${HIT_RATE}%"
              if awk "BEGIN{exit !($HIT_RATE < 50)}" 2>/dev/null; then
                echo "⚠️ 命中率低于 50%，编译耗时会明显变长。排查方向："
                echo "   ① toolchain 与 ccache 缓存版本不一致（target gcc 指纹变了 → 旧条目全 miss）"
                echo "   ② ccache 缓存被 max_size 触顶后 LRU 淘汰"
                echo "   ③ 看上方「🔍 当前生效的关键 ccache 配置」里的 compiler_check"
              else
                echo "✅ 命中率良好，缓存正在发挥预期作用"
              fi
            fi
          else
            echo "⚠️ 未找到编译后内网的 ccache 面板（可能首轮大循环未构建成功）。"
          fi
          echo "================================================="

      - name: 🧹 Rebuild Toolchain Throne # 🧹 摧毁旧制造机残骸！
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "📊 [保存前] Toolchain 最新物理体积："
          du -sh ${{ env.WORK_DIR }}/openwrt/staging_dir || true
          echo "🔍 正在抹除云端所有存在的 Toolchain 缓存..."
          gh api -X GET /repos/${{ github.repository }}/actions/caches?key=${{ runner.os }}-ubuntu-26.04-openwrt-toolchain-latest \
            | jq -r '.actions_caches[].id' \
            | xargs -I {} gh api -X DELETE /repos/${{ github.repository }}/actions/caches/{} || true
          # 清理【所有非 26.04 的】Linux 缓存（僵尸清理）：
          #   原来是 startswith("Linux-openwrt-toolchain-")，只匹配旧版命名，
          #   而旧 key 早已被删 → 这条实际上一直是个空操作。
          #   现在改成「凡是不带 ubuntu-26.04- 的 Linux 缓存一律清掉」，
          #   以后即使切回别的 Ubuntu 版本，也不会留下吃满 10GB 配额的僵尸条目。
          gh api -X GET /repos/${{ github.repository }}/actions/caches?per_page=100 \
            | jq -r '.actions_caches[] | select(.key | startswith("${{ runner.os }}-")) | select(.key | contains("ubuntu-26.04-") | not) | .id' \
            | xargs -r -I {} gh api -X DELETE "/repos/${{ github.repository }}/actions/caches/{}" || true

      - name: Save Updated Toolchain # 💾 供奉新一代重工制造机！
        if: success()
        uses: actions/cache/save@v5
        with:
          path: openwrt/staging_dir
          key: ${{ runner.os }}-ubuntu-26.04-openwrt-toolchain-latest


      - name: 🧹 Rebuild Ccache Throne # 🧹 为金库新王登基彻底清空王座！
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "📊 [保存前] Ccache 最新物理体积："
          du -sh ${{ env.WORK_DIR }}/openwrt/.ccache || true
          echo "🔍 正在执行极简化缓存策略：抹除云端所有存在的 ccache 缓存，确保新版能100%成功覆盖写入..."
          
          # 只删除【当前 key】的旧缓存，为随后的 save 腾出位置（否则 actions/cache/save 会撞 key）。
          # 注意 xargs 加 -r：否则输入为空时它仍会空跑一次（对着空 id 发 DELETE）。
          gh api -X GET "/repos/${{ github.repository }}/actions/caches?key=${{ runner.os }}-ubuntu-26.04-openwrt-ccache-latest" \
            | jq -r '.actions_caches[].id' \
            | xargs -r -I {} gh api -X DELETE "/repos/${{ github.repository }}/actions/caches/{}" || true

          echo "🎉 当前 key 的旧缓存已清空，即将写入本轮的新版本"

      - name: Save Updated Ccache # 💾 保存并升级金库！
        # 无论前面是读了旧缓存后更新的，还是全新生成的，我们最后都统一把它当做 latest 供奉到云端！
        if: success()
        uses: actions/cache/save@v5
        with:
          path: openwrt/.ccache
          # 👑 赐名 latest，独霸云端，天下仅此一份！
          key: ${{ runner.os }}-ubuntu-26.04-openwrt-ccache-latest

      - name: Delete workflow runs # 🧹 清理流水线死尸记录 (高并发阵列版)
        # ✨ 性能狂魔合并发包术：将系统 API 请求数量暴降 99%！
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. 之前是 xargs -I {} 发起循环，50 个包就要跟 GitHub 发 50 次又臭又长的 HTTP 删除请求，网速极慢。
          # 2. 我们扒掉了 -I {} ，彻底激活 xargs 数组体！它会像推土机一样把所有的 ID 打成一个包：`gh run delete ID1 ID2 ID3...`
          # 无论云端有多少个死记录，现在只发 1 次请求就能一秒连坐九族直接铲平！
          gh run list --limit 500 --json databaseId -q '.[].databaseId' | tail -n +36 | xargs -r gh run delete || true

      - name: Remove old Releases # 定时清理旧发布与孤儿 Tag
        # ✨ 性能狂魔绝杀之二：基于 Git Tag 全量扫描，斩草除根！
        if: env.UPLOAD_RELEASE == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. 直接从 Git 底层通过版本名/日期名排序拉取所有标签（隔离文件系统时间戳干扰）
          # 2. 我们将保护圈缩小到最近的 30 个“黄金版本”，对剩下的史前遗迹进行物理抹除。
          # 3. 重要数学逻辑：由于刚生成了一个新版本，它此时正占据着第 1 名的名额。
          #    为了让最终结果精准维持在 30 个，我们需要从第 30 个开始“斩首”（tail -n +30）。
          tags=$(git tag --sort=-v:refname | tail -n +30)
          
          if [ -n "$tags" ]; then
            for tag in $tags; do
              echo "🗑️ 正在执行全量清理: $tag (包含 Release 与 Git Tag)"
              # 尝试使用 gh 原生指令删除 Release 及其关联 Tag
              gh release delete "$tag" --cleanup-tag -y || true
              # 补刀：防止某些孤儿 Tag 没挂 Release 导致清理失败，直接从服务器物理删除 Tag
              git push origin --delete "$tag" || true
            done
            echo "🎉 仓库已瘦身成功，仅保留最近 30 个精华版本！"
          else
            echo "✅ 仓库体态匀称，无需进行大规模清理。"
          fi
