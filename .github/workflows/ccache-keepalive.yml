name: 💓 Double Cache Immortality Heartbeat

on:
  schedule:
    # 早上 5 点 (北京时间) = 前一天晚上 21:00 (UTC 时间)。
    # */3 表示每隔 3 天执行一次。GitHub 的淘汰线是【7 天未访问就删】，
    # 每 3 天续一次命 → 余量 4 天。就算某一次 runner 被抢占、排队或失败，
    # 也不会掉出 7 天窗口，缓存不会莫名其妙消失。
    - cron: '0 21 */3 * *'
  workflow_dispatch: # 留一个手动开关，也可以随时点击运行去续命

jobs:
  keepalive:
    runs-on: ubuntu-26.04 # 🖥️ 唯一运行环境
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: 🧲 Touch & Renew Ccache Lifespan (调用金库，触发底层续命计时)
        # 只要执行了一次 API 级的 Restore 下载动作，GitHub 服务器就会把这个大文件的“最后活跃时间 (Last Accessed)”刷成“此刻”，倒计时重新回到第 0 天。
        # ⛔【已修的严重 bug】原来这里写的是 key: Linux-openwrt-ccache-latest —— 那是【旧版】的 key，
        #    在缓存 key 加上 ubuntu-26.04 版本号之后它就再也不会被写入，早已被删除。
        #    结果：这一步骤 restore 了个空气，26.04 的 ccache 缓存【从来没有被续过命】。
        #    而本项目主 workflow 每月只跑 2 次（2 号/16 号），间隔 14 天 > GitHub 的 7 天淘汰线
        #    → 每个月的第 1 轮构建拿到的必然是空缓存，命中率永远积累不起来。
        id: ccache-touch
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: openwrt/.ccache
          key: ${{ runner.os }}-ubuntu-26.04-openwrt-ccache-latest

      - name: 🧰 Touch & Renew Toolchain Lifespan (呼叫重工制造机，为时空魔法续命)
        # 🛡️ toolchain 缓存 key 带 Ubuntu 版本号（Linux-ubuntu-26.04-...），
        #    续命保证它 7 天不被 GitHub 清理，下次构建直接命中。
        id: toolchain-touch
        uses: actions/cache/restore@v5
        with:
          path: openwrt/staging_dir
          key: ${{ runner.os }}-ubuntu-26.04-openwrt-toolchain-latest
          continue-on-error: true

      - name: 🎉 Success Verification
        run: |
          # 🛡️ 硬守卫：runner 必须是 26.04。
          #    本项目已永久放弃 ubuntu-22.04（其 clang 不支持 gn 需要的 -std=c++23），
          #    万一 runs-on 被改回旧镜像，这里第一分钟就拦下来，而不是等编译崩掉才发现。
          OS_REL=$(lsb_release -rs 2>/dev/null || cat /etc/os-release | grep '^VERSION_ID=' | cut -d'"' -f2)
          echo "🔍 发行版版本   : ${OS_REL:-未知}"
          if ! echo "${OS_REL:-}" | grep -qE '^26\.04'; then
            echo "❌ 致命：本项目已固定使用 ubuntu-26.04，当前环境是 '${OS_REL:-未知}'，拒绝继续！"
            exit 1
          fi
          echo "✅ 守卫通过：环境版本符合要求 (26.04)"

          # 🛡️【续命自检】restore 之后必须确认真的匹配上了缓存。
          #    以前 ccache 的 key 写错成已删除的旧 key，restore 静默地什么也没做，
          #    而这一步照样打印「续命成功」—— 假象比没有还坏。
          #    现在把 cache-matched-key 打出来，key 再写错会立刻看出来。
          CC_MATCHED='${{ steps.ccache-touch.outputs.cache-matched-key }}'
          TC_MATCHED='${{ steps.toolchain-touch.outputs.cache-matched-key }}'
          echo "🔑 ccache  续命匹配的 key : ${CC_MATCHED:-（未匹配！key 写错了？）}"
          echo "🔑 toolchain 续命匹配的 key : ${TC_MATCHED:-（未匹配！key 写错了？）}"
          if [ -z "$CC_MATCHED" ]; then
            echo "❌ ccache 缓存【没有被续命】！请检查 key 是否与主 workflow 的 Save Updated Ccache 一致。"
          else
            echo "✅ ccache 缓存续命成功"
          fi
          if [ -z "$TC_MATCHED" ]; then
            echo "❌ toolchain 缓存【没有被续命】！请检查 key 是否与主 workflow 的 Save Updated Toolchain 一致。"
          else
            echo "✅ toolchain 缓存续命成功"
          fi
          echo "🎉 终极极客双重续命法术释放成功！"
          echo "GitHub 服务器刚刚被这台幽灵机器光速访问了 Ccache 和 Toolchain 两大超级金库！"
          echo "系统底层已经将这两大核心建筑的『最后存活生命线』强制重置为了：从此刻起往后再加 7 天！"
          echo "真正的永生不死已达成！"
