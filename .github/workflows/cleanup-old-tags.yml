name: 🧹 Manual Cleanup (Old Tags & Releases)

on:
  workflow_dispatch: # 🖱️ 用户手动触发点单

jobs:
  cleanup:
    runs-on: ubuntu-26.04 # 🖥️ 钉死具体版本，不用 ubuntu-latest（它正在向 26.04 迁移，行为不可控）
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # 💎 性能狂魔点睛之笔：必须全量拉取 (0)，不然本地 Git 压根看不见云端的那些老旧标签历史！
          fetch-depth: 0 

      - name: 🚀 Execute Full Cleanup (30+ 斩首行动)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 🛡️ 硬守卫：runner 必须是 26.04。
          #    本项目已永久放弃 ubuntu-22.04（其 clang 不支持 gn 需要的 -std=c++23），
          #    万一 runs-on 被改回旧镜像，这里第一分钟就拦下来，而不是等编译崩掉才发现。
          OS_REL=$(lsb_release -rs 2>/dev/null || cat /etc/os-release | grep '^VERSION_ID=' | cut -d'"' -f2)
          echo "🔍 发行版版本   : ${OS_REL:-未知}"
          if ! echo "${OS_REL:-}" | grep -qE '^26\.04'; then
            echo "❌ 致命：本项目已固定使用 ubuntu-26.04，当前环境是 '${OS_REL:-未知}'，拒绝继续！"
            exit 1
          fi
          echo "✅ 守卫通过：环境版本符合要求 (26.04)"
          echo "📊 正在从本地拉取全量标签映射图..."
          
          # ✨ 性能狂魔排序术：--sort=-v:refname 
          # 专门针对版本号（1.2.3）或日期（2026.03.22）格式的字符串进行精准倒序。
          # 它不依赖文件修改时间，即便克隆后时间戳乱了，字符串比较也绝不会出错。
          tags=$(git tag --sort=-v:refname | tail -n +31)
          
          if [ -n "$tags" ]; then
            echo "发现以下超期服役的标签，准备强制抹除："
            echo "$tags"
            
            for tag in $tags; do
              echo "🗑️ 正在物理抹除: $tag"
              # 1. 优先尝试撕掉网页上的 Release 及其关联 Tag (GitHub API 级删除)
              gh release delete "$tag" --cleanup-tag -y || true
              # 2. 补刀：防止某些失败过后的“孤儿 Tag”没挂 Release 导致清理失败，直接执行 Git 协议级彻底删除
              git push origin --delete "$tag" || true
            done
            echo "🎉 [扫地机器人] 任务圆满成功！仓库已重新回归 30 个黄金版本状态。"
          else
            echo "✅ 经扫描，您的仓库目前体态匀称（≤30个），无需开启清理程序。"
          fi
